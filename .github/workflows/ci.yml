name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    # Repository tests execute trusted-local code. A skipped fork run is not release evidence.
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    env:
      # Linux runners provide Docker Engine, so the real-daemon isolation suite must run there.
      # Windows runners only offer Windows containers and macOS runners provide no container
      # runtime; the suite reports an explicit skip on both.
      ASSERTLEDGER_CONTAINER_IMAGE: ${{ matrix.os == 'ubuntu-latest' && 'node@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43' || '' }}
      ASSERTLEDGER_CONTAINER_RUNTIME: ${{ matrix.os == 'ubuntu-latest' && '["docker"]' || '' }}
      ASSERTLEDGER_REQUIRE_CONTAINER_TESTS: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provide the pinned container image
        if: matrix.os == 'ubuntu-latest'
        run: docker pull "$ASSERTLEDGER_CONTAINER_IMAGE"
      - run: pnpm check

  package:
    name: Package smoke test / Node ${{ matrix.node }} / ${{ matrix.os }}
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.15.0, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run smoke:package
      - name: Retain package and regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-evidence-${{ github.sha }}-${{ matrix.os }}-node-${{ matrix.node }}
          path: .testforge/package-smoke/*/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
