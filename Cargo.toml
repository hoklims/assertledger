[workspace]
members = ["rust/assertledger-core"]
resolver = "2"

[workspace.package]
version = "2.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/hoklims/assertledger"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
ryu-js = "1.0"
regex = "1.12"

